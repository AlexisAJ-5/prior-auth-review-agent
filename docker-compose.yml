services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env        # LLM_PROVIDER, LLM_MODEL, LLM_API_KEY (never committed)
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_PATH: /app/storage/reviews.db
    volumes:
      - review_storage:/app/storage
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
  review_storage:
